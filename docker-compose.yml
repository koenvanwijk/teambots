# TeamBots on a VPS. The app uses the *host's* Tailscale (the node you join
# with an interactive `tailscale up`) to reach the tailnet. There is no
# sidecar: a second tailscaled would be another node, and the official
# Tailscale image exits when TS_AUTHKEY is empty — which does not fit an
# interactive login.
#
# The UI is published on 127.0.0.1 and on the host's Tailscale IPv4, never
# on 0.0.0.0 / the public NIC. network_mode: host is avoided for the same
# reason: uvicorn would then listen on the public address too.
# Sandboxes join the `teambots` Docker network so the app can reach their
# interactive screens. See docs/deploy-vps.md.
#
#   cp .env.example .env   # fill TB_SECRET_KEY and TB_TAILSCALE_IP
#   docker compose up -d --build
#
# For a laptop / Docker Desktop, use docker-compose.local.yml
# (./start.sh and .\start.ps1).
services:
  sandbox-image:
    build: ./sandbox
    image: teambots-sandbox:latest
    command: ["true"]
    restart: "no"

  app:
    build: .
    image: teambots-app:latest
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - mkdir -p /data/claude-home /data/claude-cli-cwd && exec uvicorn app.main:app --host 0.0.0.0 --port 18080 --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "127.0.0.1:18080:18080"
      - "${TB_TAILSCALE_IP:?set TB_TAILSCALE_IP to the host Tailscale IPv4 (tailscale ip -4)}:18080:18080"
    environment:
      TB_SECRET_KEY: ${TB_SECRET_KEY:?set TB_SECRET_KEY in .env (long random string)}
      TB_TIMEZONE: ${TB_TIMEZONE:-Europe/Amsterdam}
      TB_SANDBOX: docker
      TB_SANDBOX_IMAGE: teambots-sandbox:latest
      TB_SANDBOX_NETWORK: teambots
      TB_HTTP_ALLOW_PRIVATE: ${TB_HTTP_ALLOW_PRIVATE:-1}
      TB_PUBLIC_URL: ${TB_PUBLIC_URL:-}
      TB_DATA_DIR: /data
      TB_CLAUDE_CLI: claude
      TB_CLAUDE_CLI_CWD: /data/claude-cli-cwd
      HOME: /data/claude-home
    volumes:
      - ${TB_HOST_DATA:-./data}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [teambots]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

networks:
  teambots:
    name: teambots
