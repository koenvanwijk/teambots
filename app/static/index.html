<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamBots</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --line:#dfe3ea; --ink:#1c2330; --muted:#677084; --accent:#2f5fd0; --accent-soft:#e8eefc; --violet:#6b4fc4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --panel:#1c2029; --line:#2f3542; --ink:#e8ebf1; --muted:#98a1b3; --accent:#7ea2f5; --accent-soft:#25304a; --violet:#b19cf0; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:5px 10px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  @media (prefers-color-scheme: dark) { button.primary { color:#10131a; } }
  input, select, textarea { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:6px 8px; width:100%; }
  textarea { resize:vertical; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  #auth { margin:auto; width:320px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px; }
  #side { width:250px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:auto; }
  #side h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 12px 4px; display:flex; justify-content:space-between; align-items:center; }
  #side h3 button { padding:0 7px; font-size:13px; }
  .item { padding:6px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:6px; }
  .item:hover, .item.on { background:var(--accent-soft); }
  .tag { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:0 6px; white-space:nowrap; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #head { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #msgs { flex:1; overflow:auto; padding:16px; }
  .msg { max-width:820px; margin:0 auto 12px; }
  .msg .who { font-weight:600; font-size:12.5px; }
  .msg .who.bot { color:var(--violet); }
  .msg .body { white-space:pre-wrap; overflow-wrap:anywhere; }
  .toolrow { max-width:820px; margin:0 auto 8px; font:12px ui-monospace, monospace; color:var(--muted); border-left:2px solid var(--line); padding-left:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .card { max-width:820px; margin:0 auto 12px; border:1.5px solid var(--accent); background:var(--accent-soft); border-radius:8px; padding:10px 12px; }
  .card pre { margin:6px 0; white-space:pre-wrap; overflow-wrap:anywhere; font:12px ui-monospace, monospace; }
  #compose { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  #panel { width:380px; background:var(--panel); border-left:1px solid var(--line); padding:14px; overflow:auto; display:none; }
  #panel h2 { font-size:15px; margin:0 0 8px; }
  #panel h4 { margin:16px 0 4px; font-size:13px; border-top:1px solid var(--line); padding-top:12px; }
  .row { display:flex; gap:6px; align-items:center; margin:4px 0; }
  .row > span { flex:1; overflow-wrap:anywhere; }
  .hint { color:var(--muted); font-size:12px; }
  img.shot { max-width:100%; border:1px solid var(--line); border-radius:6px; display:block; margin:4px 0; }
  .proj { max-width:820px; margin:0 auto 14px; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:12px 14px; }
  .proj h3 { margin:0 0 4px; font-size:14px; }
  .err { color:var(--violet); font-size:12.5px; min-height:18px; }
</style>
</head>
<body>
<script>

async function api(method, path, body) {
  const r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));

}
const ask = (text, dflt = '') => window.prompt(text, dflt);
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { window.alert(e.message); } };

// ---------- sign in
function showAuth() {
  document.body.replaceChildren();
  const u = $('input', { placeholder: 'username' }), p = $('input', { type: 'password', placeholder: 'password (8+ characters)' }), d = $('input', { placeholder: 'display name (new accounts)' }), err = $('div', { className: 'err' });
  const go = path => async () => { try { const r = await api('POST', path, { username: u.value, password: p.value, display_name: d.value }); S.token = r.token; localStorage.setItem('tb_token', r.token); boot(); } catch (e) { err.textContent = e.message; } };
  document.body.append($('div', { id: 'auth' }, $('h2', { textContent: 'TeamBots' }), $('label', { textContent: 'Username' }), u, $('label', { textContent: 'Password' }), p, $('label', { textContent: 'Display name' }), d, err,
    $('div', { className: 'row' }, $('button', { className: 'primary', textContent: 'Sign in', onclick: go('/login') }), $('button', { textContent: 'Create account', onclick: go('/register') }))));
}

// ---------- shell
async function boot() {
  try { S.me = await api('GET', '/me'); } catch { S.token = null; localStorage.removeItem('tb_token'); return showAuth(); }

  document.body.replaceChildren($('div', { id: 'side' }), $('div', { id: 'main' }, $('div', { id: 'head' }), $('div', { id: 'msgs' }), $('div', { id: 'compose' })), $('div', { id: 'panel' }));
  await refreshSide();
}
const el = id => document.getElementById(id);
const label = t => (t.client ? t.client + ' / ' : '') + t.name;
const withToken = path => '/api' + path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(S.token);

async function refreshSide() {
  const side = el('side'); side.replaceChildren();
  const sel = $('select', { onchange: () => { localStorage.setItem('tb_team', sel.value); S.conv = null; boot(); } }, S.teams.map(t => $('option', { value: t.id, textContent: label(t), selected: S.team && t.id === S.team.id })));
  side.append($('div', { style: 'padding:12px' }, $('div', { className: 'hint', textContent: 'Signed in as ' + S.me.display_name }), S.teams.length ? sel : null,
    $('div', { className: 'row' }, $('button', { textContent: 'Overview', onclick: guard(showOverview) }), $('button', { textContent: 'New project', onclick: guard(async () => { const n = ask('Project name'); if (!n) return; const client = ask('Client this project belongs to (optional)') || ''; const t = await api('POST', '/teams', { name: n, client }); localStorage.setItem('tb_team', t.id); boot(); }) }),
      $('button', { textContent: 'Join', onclick: guard(async () => { const c = ask('Invite code'); if (c) { const t = await api('POST', '/teams/join', { invite_code: c }); localStorage.setItem('tb_team', t.id); boot(); } }) })),
    S.team && S.team.invite_code ? $('div', { className: 'hint', textContent: 'Invite code: ' + S.team.invite_code }) : null));
  if (!S.team) return;
  [S.bots, S.channels, S.members] = await Promise.all([api('GET', `/teams/${S.team.id}/bots`), api('GET', `/teams/${S.team.id}/channels`), api('GET', `/teams/${S.team.id}/members`)]);
  side.append($('h3', {}, 'Bots', $('button', { textContent: '+', title: 'New bot', onclick: guard(newBot) })));
  for (const b of S.bots) side.append($('div', { className: 'item' + (S.conv && S.conv.kind === 'dm' && S.conv.bot_id === b.id ? ' on' : ''), onclick: guard(async () => openConv(await api('POST', `/bots/${b.id}/dm`), b)) },
    $('span', { textContent: b.name }), $('span', { className: 'tag', textContent: !b.is_team ? 'personal' : b.published ? 'team · ' + b.role : 'draft' })));
  const teamBots = S.bots.filter(b => b.is_team && b.published);
  if (teamBots.length) side.append($('h3', {}, 'Activity'));
  for (const b of teamBots) side.append($('div', { className: 'item' + (S.conv && S.conv.kind === 'feed' && S.conv.bot_id === b.id ? ' on' : ''), onclick: guard(async () => openConv(await api('GET', `/bots/${b.id}/feed`), b)) }, $('span', { textContent: b.name + ' activity' })));
  side.append($('h3', {}, 'Channels', $('button', { textContent: '+', title: 'New channel', onclick: guard(newChannel) })));
  for (const c of S.channels) side.append($('div', { className: 'item' + (S.conv && S.conv.id === c.id ? ' on' : ''), onclick: guard(() => openConv(c, null)) }, $('span', { textContent: '# ' + c.name })));
  side.append($('h3', {}, 'Endpoints', $('button', { textContent: '+', title: 'New endpoint', onclick: guard(newEndpoint) })));
  for (const e of await api('GET', `/teams/${S.team.id}/endpoints`)) side.append($('div', { className: 'item', title: e.base_url, onclick: guard(async () => { const t = await api('POST', `/endpoints/${e.id}/test`); window.alert(`${e.name}\nreachable: ${t.reachable}\ntool calling: ${t.tool_calling}\n${t.detail}`); }) },
    $('span', { textContent: e.name }), $('span', { className: 'tag', textContent: e.default_model })));
  side.append($('div', { style: 'padding:12px;margin-top:auto' }, $('button', { textContent: 'Sign out', onclick: () => { localStorage.removeItem('tb_token'); S.token = null; showAuth(); } })));
}

async function showOverview() {
  S.conv = null; if (S.es) S.es.close(); el('panel').style.display = 'none'; el('compose').replaceChildren();
  el('head').replaceChildren($('strong', { textContent: 'All projects' }), $('span', { className: 'hint', textContent: 'Every project you are in, grouped by client, with the latest shared activity.' }));
  const box = el('msgs'); box.replaceChildren(); let client = null;

    box.append($('div', { className: 'proj' }, $('div', { className: 'row' }, $('h3', { textContent: p.name, style: 'flex:1' }), $('button', { textContent: 'Open', onclick: () => { localStorage.setItem('tb_team', p.id); boot(); } })),
      $('div', { className: 'hint', textContent: `${p.people} people · bots: ${p.bots.map(b => '@' + b.handle).join(' ') || 'none'}` }),
      p.activity.length ? p.activity.map(a => $('div', { className: 'toolrow', textContent: `${a.bot} · ${a.content}` })) : $('div', { className: 'hint', textContent: 'No shared activity yet.' })));
  }
}
async function newEndpoint() {
  const name = ask('Endpoint name (e.g. dgx-spark)'); if (!name) return;
  const base_url = ask('Base URL of the OpenAI-compatible API', 'http://localhost:8000/v1'); if (!base_url) return;

// ---------- conversation
async function openConv(conv, bot) {

      $('button', { textContent: 'Add people or bots', onclick: guard(async () => {

        openConv(conv, null); }) }),
      $('button', { textContent: 'Manage bots', onclick: guard(async () => {
        const mem2 = await api('GET', `/channels/${conv.id}/members`);
        const list = mem2.bots.map(b => '@' + b.handle + (b.mention_only ? ' mention-only' : ' replies to all')).join(', ') || '(none)';
        const who = ask('Bots in this channel: ' + list + '\nType -@handle to remove, mention @handle for mention-only, all @handle to reply to every message.');
        if (!who) return;
        const raw = who.trim();
        const rm = raw.match(/^[-]\s*@?([A-Za-z0-9_-]+)$/i);
        const mo = raw.match(/^mention\s+@?([A-Za-z0-9_-]+)$/i);
        const all = raw.match(/^all\s+@?([A-Za-z0-9_-]+)$/i);
        const handle = (rm || mo || all || [])[1];
        const bot = mem2.bots.find(b => b.handle.toLowerCase() === (handle || '').toLowerCase());
        if (!bot) { alert('Unknown bot or command. Use -@handle, mention @handle, or all @handle.'); return; }
        if (rm) await api('DELETE', `/channels/${conv.id}/members/bots/${bot.id}`);
        else if (mo) await api('PATCH', `/channels/${conv.id}/members/bots/${bot.id}`, { mention_only: true });
        else await api('PATCH', `/channels/${conv.id}/members/bots/${bot.id}`, { mention_only: false });
        openConv(conv, null); }) })); }
  const ta = $('textarea', { rows: 2, placeholder: conv.kind === 'dm' ? 'Message ' + conv.name : 'Message the channel. Bots reply to every message by default. Use @handle to talk to one bot.' });
  const send = guard(async () => { const t = ta.value.trim(); if (!t) return; ta.value = ''; await api('POST', `/conversations/${conv.id}/messages`, { content: t }); });

}
async function renderMessages() {

    for (const tc of m.tool_calls) box.append($('div', { className: 'toolrow', textContent: `→ ${m.author} uses ${tc.function.name} ${tc.function.arguments}` }));

  for (const a of approvals) box.append($('div', { className: 'card' }, $('strong', { textContent: `${a.bot} wants to use ${a.tool_name}` }), $('pre', { textContent: JSON.stringify(a.arguments, null, 2) }),
    a.mine ? $('div', { className: 'row' }, $('button', { className: 'primary', textContent: 'Allow once', onclick: guard(() => api('POST', `/approvals/${a.id}`, { allow: true })) }),
      $('button', { textContent: 'Always allow', onclick: guard(() => api('POST', `/approvals/${a.id}`, { allow: true, always: true })) }), $('button', { textContent: 'Deny', onclick: guard(() => api('POST', `/approvals/${a.id}`, { allow: false })) }))
      : $('div', { className: 'hint', textContent: `Waiting for ${a.requester} to decide.` })));
  box.scrollTop = box.scrollHeight;
}

// ---------- bot settings
async function openPanel(bot) {

  const manage = bot.role !== 'collaborator', again = () => openPanel(bot);
  p.append($('div', { className: 'row' }, $('h2', { textContent: `${bot.name} (@${bot.handle})`, style: 'flex:1' }), $('button', { textContent: 'Close', onclick: () => { clearInterval(S.screenTimer); p.style.display = 'none'; } })),
    $('div', { className: 'hint', textContent: `Your role: ${bot.role}. ` + (bot.is_team ? 'Team Bot.' : 'Personal bot.') }));

    const open = $('button', { textContent: 'Open scherm', title: 'Interactief scherm: muis en toetsenbord, om zelf in te loggen in Chromium',

    const tick = () => { const n = new Image(); n.onload = () => { img.src = n.src; note.textContent = 'Refreshes every 3 seconds.'; }; n.onerror = () => { note.textContent = 'Screen not available (needs the Docker sandbox).'; }; n.src = withToken(`/bots/${bot.id}/screen.jpg?t=${Date.now()}`); };

  };

    const mode = $('select', {}, $('option', { value: 'ask', textContent: 'Ask before risky actions', selected: bot.approval_mode === 'ask' }), $('option', { value: 'auto', textContent: 'Run everything automatically', selected: bot.approval_mode === 'auto' }));
    const cu = $('input', { type: 'checkbox', checked: bot.computer_use, style: 'width:auto' });
    p.append($('label', { textContent: 'Instructions' }), ins, $('label', { textContent: 'Model override' }), model, $('label', { textContent: 'Approvals' }), mode,
      $('div', { className: 'row' }, cu, $('span', { textContent: 'Own screen and computer use (needs a model with image input)' })),
      $('div', { className: 'row' }, $('button', { className: 'primary', textContent: 'Save', onclick: guard(async () => { Object.assign(bot, await api('PATCH', `/bots/${bot.id}`, { instructions: ins.value, model: model.value, approval_mode: mode.value, computer_use: cu.checked })); refreshSide(); again(); }) }),
        bot.role === 'owner' ? $('button', { textContent: 'Delete bot', onclick: guard(async () => { if (window.confirm('Delete this bot for everyone, with all chats, memory and routines? This cannot be undone.')) { await api('DELETE', `/bots/${bot.id}`); S.conv = null; boot(); } }) }) : null));
    if (bot.is_team) {
      const sh = await api('GET', `/bots/${bot.id}/share`);
      const pub = $('input', { type: 'checkbox', checked: sh.published, style: 'width:auto' }), acc = $('select', {}, $('option', { value: 'team', textContent: 'Whole team', selected: sh.access === 'team' }), $('option', { value: 'selected', textContent: 'Selected people only', selected: sh.access === 'selected' }));
      const rows = S.members.filter(m => m.user_id !== bot.owner_id).map(m => { const cur = sh.members.find(x => x.user_id === m.user_id);
