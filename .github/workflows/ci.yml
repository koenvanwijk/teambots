name: CI

# Throw a push, a PR, or a manual run at this and it runs the tests and builds both
# Docker images. On main it also publishes the images to GHCR so a server can pull them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          TB_SANDBOX: local
          TB_SECRET_KEY: ci-secret
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push images to GHCR on main
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: ./Dockerfile
          - name: sandbox
            context: ./sandbox
            file: ./sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.ref == 'refs/heads/main' && ' and push' || '' }} ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Build on every run; only publish when landing on main.
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/teambots-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/teambots-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
